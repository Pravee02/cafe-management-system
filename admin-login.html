<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOOP CAFE | Admin Login</title>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="owner-wrapper">

  <div class="owner-login-card glass">
    <h2>Owner <span>Login</span></h2>
    <p>Sign in to manage menus, photos & reviews</p>
    
    <div class="owner-status-msg error" id="login-error-msg">Invalid username or password.</div>
    
    <form id="owner-login-form">
      <div class="form-group" style="text-align: left;">
        <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Username</label>
        <input type="text" id="owner-username" required placeholder="Username">
      </div>
      <div class="form-group" style="text-align: left;">
        <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Password</label>
        <input type="password" id="owner-password" required placeholder="Password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
    </form>
    
    <div style="margin-top: 20px; text-align: center;">
      <a href="/" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: underline;">Back to Website</a>
    </div>
  </div>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginCard = document.querySelector('.owner-login-card');
      const form = document.getElementById('owner-login-form');
      const errorMsg = document.getElementById('login-error-msg');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('owner-username').value.trim();
        const password = document.getElementById('owner-password').value.trim();

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        })
        .then(res => {
          if (!res.ok) throw new Error('Unauthorized');
          return res.json();
        })
        .then(() => {
          // Success
          errorMsg.style.display = 'none';
          gsap.to(loginCard, {
            opacity: 0,
            y: -50,
            duration: 0.4,
            onComplete: () => {
              window.location.href = '/dashboard';
            }
          });
        })
        .catch(err => {
          errorMsg.style.display = 'block';
          gsap.fromTo(loginCard, { x: -10 }, { x: 0, duration: 0.1, repeat: 3, yoyo: true });
        });
      });
    });
  </script>
</body>
</html>
